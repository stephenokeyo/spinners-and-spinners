databases:
  - name: spinners-db
    plan: free
    databaseName: spinners
    user: spinners

services:
  - type: web
    name: spinners-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/bootstrap
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spinners-db
          property: connectionString
