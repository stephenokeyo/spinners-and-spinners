services:
  - type: web
    name: weartexstyle
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/bootstrap
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SETUP_TOKEN
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
